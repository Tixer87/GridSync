name: Pit Radio

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      mode:
        description: "test | manual"
        required: true
        default: "test"

      manual_title:
        description: "Release / announcement title"
        required: false
        default: ""

      manual_intro:
        description: "Short intro"
        required: false
        default: ""

      manual_details:
        description: "Details separated with |"
        required: false
        default: ""

      manual_url:
        description: "GridSync page"
        required: false
        default: ""

jobs:
  broadcast:
    runs-on: ubuntu-latest

    steps:
      - name: Broadcast to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          CANNABEEZ_WEBHOOK: ${{ secrets.CANNABEEZ_DISCORD_WEBHOOK }}

          GRIDSYNC_ROLE_ID: "1553676045692043294"
          CANNABEEZ_ROLE_ID: "1143968549883351101"

          # GridSync custom emoji IDs
          EMOJI_GRIDSYNC: "1554093128946815106"
          EMOJI_GRIDSYNC_LOGO: "1554093066040901723"
          EMOJI_DISCORD_HEAD: "1554093005538066532"
          EMOJI_VOICE_PACKS: "1554093292776325170"
          EMOJI_RATIX: "1554093240339267604"
          EMOJI_TOOLS: "1554093263399559178"
          EMOJI_DOWNLOAD: "1554093199637872690"
          EMOJI_IRD: "1554093552143827005"
          EMOJI_IRACEDECK: "1554093390130585661"
          EMOJI_CAR1: "1554096426781249546"
          EMOJI_CAR2: "1554096456888221726"
          EMOJI_CAR3: "1554096479256317982"

          EVENT_NAME: ${{ github.event_name }}

          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_BODY: ${{ github.event.release.body }}

          MANUAL_MODE: ${{ github.event.inputs.mode }}
          MANUAL_TITLE: ${{ github.event.inputs.manual_title }}
          MANUAL_INTRO: ${{ github.event.inputs.manual_intro }}
          MANUAL_DETAILS: ${{ github.event.inputs.manual_details }}
          MANUAL_URL: ${{ github.event.inputs.manual_url }}

        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error


          gridsync_webhook = os.environ["DISCORD_WEBHOOK"].strip()
          cannabeez_webhook = os.environ["CANNABEEZ_WEBHOOK"].strip()

          gridsync_role_id = os.environ["GRIDSYNC_ROLE_ID"].strip()
          cannabeez_role_id = os.environ["CANNABEEZ_ROLE_ID"].strip()

          event = os.environ.get("EVENT_NAME", "")
          mode = (os.environ.get("MANUAL_MODE") or "").strip().lower()


          def custom_emoji(name, env_name, fallback):
              emoji_id = (os.environ.get(env_name) or "").strip()

              if not emoji_id or emoji_id == "PASTE_ID_HERE":
                  return fallback

              return f"<:{name}:{emoji_id}>"


          GS = custom_emoji(
              "gridsync_symbol",
              "EMOJI_GRIDSYNC",
              "🏁"
          )

          DISCORD = custom_emoji(
              "discord_head",
              "EMOJI_DISCORD_HEAD",
              "💬"
          )

          VOICE_PACKS = custom_emoji(
              "voice_packs_symbol",
              "EMOJI_VOICE_PACKS",
              "🎙️"
          )

          RATIX = custom_emoji(
              "ratix_symbol",
              "EMOJI_RATIX",
              "📊"
          )

          TOOLS = custom_emoji(
              "tools_symbol",
              "EMOJI_TOOLS",
              "🛠️"
          )

          DOWNLOAD = custom_emoji(
              "download_symbol",
              "EMOJI_DOWNLOAD",
              "⬇️"
          )

          IRD = custom_emoji(
              "ird",
              "EMOJI_IRD",
              "🏎️"
          )

          IRACEDECK = custom_emoji(
              "iracedeck",
              "EMOJI_IRACEDECK",
              "🏎️"
          )


          def trim(text, limit):
              text = text or ""

              if len(text) <= limit:
                  return text

              return text[:limit - 3] + "..."


          def send(webhook, payload, role_id="", ping_role=False):
              message = json.loads(json.dumps(payload))

              if ping_role and role_id:
                  message["content"] = (
                      f"<@&{role_id}>\n"
                      + message.get("content", "")
                  )

                  message["allowed_mentions"] = {
                      "roles": [role_id]
                  }

              else:
                  message["allowed_mentions"] = {
                      "parse": []
                  }

              request = urllib.request.Request(
                  webhook,
                  data=json.dumps(message).encode("utf-8"),
                  headers={
                      "Content-Type": "application/json",
                      "Accept": "application/json",
                      "User-Agent": (
                          "DiscordBot "
                          "(https://gridsync.ch, 1.0)"
                      )
                  },
                  method="POST"
              )

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=20
                  ) as response:

                      print(
                          "Pit Radio broadcast successful: "
                          f"HTTP {response.status}"
                      )

              except urllib.error.HTTPError as error:
                  print(
                      f"Discord returned HTTP {error.code}"
                  )

                  print(
                      error.read().decode(
                          "utf-8",
                          errors="replace"
                      )
                  )

                  raise


          if event == "release":
              name = (
                  os.environ.get("RELEASE_NAME")
                  or "New GridSync Release"
              )

              url = os.environ.get(
                  "RELEASE_URL",
                  ""
              )

              body = trim(
                  (
                      os.environ.get("RELEASE_BODY")
                      or ""
                  ).strip(),
                  1700
              )

              payload = {
                  "content": (
                      f"{GS} "
                      "**PIT RADIO // NEW RELEASE**"
                  ),

                  "embeds": [
                      {
                          "title": name,

                          "description": (
                              body
                              or
                              "A new GridSync release "
                              "is now available."
                          ),

                          "color": 16766720,

                          "fields": [
                              {
                                  "name": (
                                      f"{DOWNLOAD} "
                                      "GridSync Release"
                                  ),

                                  "value": (
                                      f"[Open release]({url})"
                                  ),

                                  "inline": False
                              }
                          ],

                          "footer": {
                              "text": (
                                  "Pit Radio · "
                                  "GridSync Community"
                              )
                          }
                      }
                  ]
              }


          elif mode == "manual":
              title = trim(
                  (
                      os.environ.get("MANUAL_TITLE")
                      or ""
                  ).strip()
                  or "GridSync Announcement",
                  256
              )

              intro = trim(
                  (
                      os.environ.get("MANUAL_INTRO")
                      or ""
                  ).strip(),
                  500
              )

              url = (
                  os.environ.get("MANUAL_URL")
                  or ""
              ).strip()

              raw_details = (
                  os.environ.get("MANUAL_DETAILS")
                  or ""
              ).strip()

              details = [
                  item.strip()
                  for item in raw_details.split("|")
                  if item.strip()
              ]

              icons = [
                  GS,
                  DISCORD,
                  VOICE_PACKS,
                  RATIX,
                  TOOLS,
                  DOWNLOAD,
                  IRD,
                  IRACEDECK
              ]

              detail_lines = []

              for index, item in enumerate(details):
                  if index < len(icons):
                      icon = icons[index]
                  else:
                      icon = "•"

                  detail_lines.append(
                      f"{icon} {item}"
                  )

              description_parts = []

              if intro:
                  description_parts.append(
                      f"*{intro}*"
                  )

              if detail_lines:
                  description_parts.append(
                      "\n".join(detail_lines)
                  )

              description = "\n\n".join(
                  description_parts
              )

              fields = []

              if url:
                  fields.append(
                      {
                          "name": (
                              f"{DOWNLOAD} "
                              "Previews · Details · Download"
                          ),

                          "value": (
                              f"[Open on GridSync]({url})"
                          ),

                          "inline": False
                      }
                  )

              payload = {
                  "content": (
                      f"{GS} "
                      "**PIT RADIO // GRIDSync BULLETIN**"
                  ),

                  "embeds": [
                      {
                          "title": title,

                          "description": (
                              description
                              or "GridSync update."
                          ),

                          "color": 16766720,

                          "fields": fields,

                          "footer": {
                              "text": (
                                  "Pit Radio · "
                                  "GridSync Community"
                              )
                          }
                      }
                  ]
              }


          else:
              payload = {
                  "content": (
                      f"{GS} "
                      "**Pit Radio check. "
                      "Radio loud and clear.**"
                  ),

                  "embeds": [
                      {
                          "title": (
                              "GridSync Pit Radio"
                          ),

                          "description": (
                              "Automatic release broadcasts "
                              "are connected and ready."
                          ),

                          "color": 16766720,

                          "footer": {
                              "text": (
                                  "Pit Radio · "
                                  "GridSync Community"
                              )
                          }
                      }
                  ]
              }


          ping_role = (
              event == "release"
              or mode == "manual"
          )


          send(
              gridsync_webhook,
              payload,
              gridsync_role_id,
              ping_role
          )

          send(
              cannabeez_webhook,
              payload,
              cannabeez_role_id,
              ping_role
          )
          PY
