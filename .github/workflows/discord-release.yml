name: Pit Radio

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      mode:
        description: "test | manual"
        required: true
        default: "test"
      manual_title:
        description: "Manual embed title"
        required: false
        default: ""
      manual_url:
        description: "Manual link"
        required: false
        default: ""
      manual_body:
        description: "Manual message body"
        required: false
        default: ""

jobs:
  broadcast:
    runs-on: ubuntu-latest
    steps:
      - name: Broadcast to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_BODY: ${{ github.event.release.body }}
          MANUAL_MODE: ${{ github.event.inputs.mode }}
          MANUAL_TITLE: ${{ github.event.inputs.manual_title }}
          MANUAL_URL: ${{ github.event.inputs.manual_url }}
          MANUAL_BODY: ${{ github.event.inputs.manual_body }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          webhook = os.environ["DISCORD_WEBHOOK"].strip()
          event = os.environ.get("EVENT_NAME", "")
          manual_mode = (os.environ.get("MANUAL_MODE") or "").strip().lower()
          manual_title = (os.environ.get("MANUAL_TITLE") or "").strip()
          manual_url = (os.environ.get("MANUAL_URL") or "").strip()
          manual_body = (os.environ.get("MANUAL_BODY") or "").strip()

          def trim(text, limit):
              text = text or ""
              return text if len(text) <= limit else text[:limit - 3] + "..."

          if event == "release":
              name = os.environ.get("RELEASE_NAME") or "New GridSync Release"
              url = os.environ.get("RELEASE_URL", "")
              body = trim((os.environ.get("RELEASE_BODY") or "").strip(), 1800)

              payload = {
                  "content": "🏁 **NEW GRIDSYNC RELEASE — LIVE ON AIR**",
                  "embeds": [
                      {
                          "title": name,
                          "url": url,
                          "description": body or "A new GridSync release is now available.",
                          "color": 16766720,
                          "footer": {
                              "text": "Pit Radio · GridSync Community"
                          }
                      }
                  ]
              }

          elif manual_mode == "manual":
              payload = {
                  "content": "📻 **Pit Radio special bulletin**",
                  "embeds": [
                      {
                          "title": trim(manual_title or "GridSync Announcement", 256),
                          "url": manual_url or None,
                          "description": trim(manual_body or "Manual GridSync broadcast.", 3500),
                          "color": 16766720,
                          "footer": {
                              "text": "Pit Radio · GridSync Community"
                          }
                      }
                  ]
              }

          else:
              payload = {
                  "content": "📻 **Pit Radio check. Radio loud and clear.**",
                  "embeds": [
                      {
                          "title": "GridSync Pit Radio",
                          "description": "Automatic release broadcasts are connected and ready.",
                          "color": 16766720,
                          "footer": {
                              "text": "Pit Radio · GridSync Community"
                          }
                      }
                  ]
              }

          request = urllib.request.Request(
              webhook,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "Accept": "application/json",
                  "User-Agent": "DiscordBot (https://gridsync.ch, 1.0)"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  print(f"Pit Radio broadcast successful: HTTP {response.status}")
          except urllib.error.HTTPError as error:
              print(f"Discord returned HTTP {error.code}")
              print(error.read().decode("utf-8", errors="replace"))
              raise
          PY
