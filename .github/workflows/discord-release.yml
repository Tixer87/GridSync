name: Pit Radio

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      mode:
        description: "Pit Radio mode"
        required: true
        default: "test"
        type: choice
        options: [test, manual]
      target:
        description: "Discord target"
        required: true
        default: "gridsync"
        type: choice
        options: [gridsync, cannabeez, both]
      manual_title:
        description: "Release / announcement title"
        required: false
        default: ""
      manual_intro:
        description: "Short intro"
        required: false
        default: ""
      manual_details:
        description: "Details separated with |"
        required: false
        default: ""
      manual_url:
        description: "GridSync page"
        required: false
        default: ""

jobs:
  broadcast:
    runs-on: ubuntu-latest
    steps:
      - name: Broadcast to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          CANNABEEZ_WEBHOOK: ${{ secrets.CANNABEEZ_DISCORD_WEBHOOK }}
          GRIDSYNC_ROLE_ID: "1553676045692043294"
          CANNABEEZ_ROLE_ID: "1143968549883351101"

          EMOJI_CAR1: "1554096426781249546"
          EMOJI_CAR2: "1554096456888221726"
          EMOJI_CAR3: "1554096479256317982"
          EMOJI_DISCORD_HEAD: "1554093005538066532"
          EMOJI_DOWNLOAD: "1554093199637872690"
          EMOJI_GRIDSYNC_LOGO: "1554093066040901723"
          EMOJI_GRIDSYNC: "1554093128946815106"
          EMOJI_IRACEDECK: "1554093390130585661"
          EMOJI_IRDH: "1554093552143827005"
          EMOJI_RATIX: "1554093240339267604"
          EMOJI_TOOLS: "1554093263399559178"
          EMOJI_VOICE_PACKS: "1554093292776325170"

          EVENT_NAME: ${{ github.event_name }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_BODY: ${{ github.event.release.body }}
          MANUAL_MODE: ${{ github.event.inputs.mode }}
          MANUAL_TARGET: ${{ github.event.inputs.target }}
          MANUAL_TITLE: ${{ github.event.inputs.manual_title }}
          MANUAL_INTRO: ${{ github.event.inputs.manual_intro }}
          MANUAL_DETAILS: ${{ github.event.inputs.manual_details }}
          MANUAL_URL: ${{ github.event.inputs.manual_url }}

        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error

          WEBSITE = "https://gridsync.ch/"
          event = os.getenv("EVENT_NAME", "")
          mode = os.getenv("MANUAL_MODE", "").strip().lower()
          target = os.getenv("MANUAL_TARGET", "gridsync").strip().lower()

          if event == "release":
              target = "both"
          if target not in {"gridsync", "cannabeez", "both"}:
              target = "gridsync"

          cfg = {
              "gs": ("gridsync_symbol", "EMOJI_GRIDSYNC", "\U0001F3C1"),
              "logo": ("gridsync_logo_discord", "EMOJI_GRIDSYNC_LOGO", "\U0001F3C1"),
              "discord": ("discord_head", "EMOJI_DISCORD_HEAD", "\U0001F4AC"),
              "download": ("download_symbol", "EMOJI_DOWNLOAD", "\u2B07\uFE0F"),
              "voice": ("voice_packs_symbol", "EMOJI_VOICE_PACKS", "\U0001F399\uFE0F"),
              "ratix": ("ratix_symbol", "EMOJI_RATIX", "\U0001F4CA"),
              "tools": ("tools_symbol", "EMOJI_TOOLS", "\U0001F6E0\uFE0F"),
              "iracedeck": ("iracedeck", "EMOJI_IRACEDECK", "\U0001F3CE\uFE0F"),
              "irdh": ("irdh", "EMOJI_IRDH", "\U0001F3CE\uFE0F"),
              "car1": ("car1", "EMOJI_CAR1", "\U0001F3CE\uFE0F"),
              "car2": ("car2", "EMOJI_CAR2", "\U0001F3CE\uFE0F"),
              "car3": ("car3", "EMOJI_CAR3", "\U0001F3CE\uFE0F")
          }

          def icons(custom):
              return {
                  k: f"<:{name}:{os.getenv(env)}>" if custom and os.getenv(env) else fallback
                  for k, (name, env, fallback) in cfg.items()
              }

          def trim(text, limit):
              text = text or ""
              return text if len(text) <= limit else text[:limit - 3] + "..."

          def send(webhook, payload, role="", ping=False):
              msg = json.loads(json.dumps(payload))
              msg["allowed_mentions"] = {"roles": [role]} if ping and role else {"parse": []}
              if ping and role:
                  msg["content"] = f"<@&{role}>\n" + msg.get("content", "")

              req = urllib.request.Request(
                  webhook,
                  data=json.dumps(msg).encode(),
                  headers={
                      "Content-Type": "application/json",
                      "User-Agent": "DiscordBot (https://gridsync.ch, 1.0)"
                  },
                  method="POST"
              )

              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      print(f"Pit Radio broadcast successful: HTTP {r.status}")
              except urllib.error.HTTPError as e:
                  print(e.read().decode(errors="replace"))
                  raise

          def build(custom):
              e = icons(custom)

              if event == "release":
                  name = os.getenv("RELEASE_NAME") or "New GridSync Release"
                  url = os.getenv("RELEASE_URL", "")
                  body = trim(os.getenv("RELEASE_BODY", "").strip(), 1700)

                  return {
                      "content": f"{e['gs']} **PIT RADIO // NEW RELEASE**",
                      "embeds": [{
                          "title": name,
                          "url": WEBSITE,
                          "description": body or "A new GridSync release is now available.",
                          "color": 16766720,
                          "fields": [{
                              "name": f"{e['download']} GridSync Release",
                              "value": f"[Open release]({url})",
                              "inline": False
                          }],
                          "footer": {"text": "Pit Radio · GridSync Community"}
                      }]
                  }

              if mode == "manual":
                  title = trim(
                      os.getenv("MANUAL_TITLE", "").strip()
                      or "GridSync Announcement",
                      256
                  )
                  intro = trim(os.getenv("MANUAL_INTRO", "").strip(), 500)
                  url = os.getenv("MANUAL_URL", "").strip()
                  details = [
                      x.strip()
                      for x in os.getenv("MANUAL_DETAILS", "").split("|")
                      if x.strip()
                  ]

                  order = [
                      "gs", "discord", "voice", "ratix", "tools",
                      "download", "irdh", "iracedeck", "car1", "car2", "car3"
                  ]

                  lines = [
                      f"{e[order[i]] if i < len(order) else '•'} {x}"
                      for i, x in enumerate(details)
                  ]

                  desc = "\n\n".join(
                      x for x in [
                          f"*{intro}*" if intro else "",
                          "\n".join(lines)
                      ] if x
                  )

                  fields = [{
                      "name": f"{e['download']} Previews · Details · Download",
                      "value": f"[Open on GridSync]({url})",
                      "inline": False
                  }] if url else []

                  return {
                      "content": f"{e['gs']} **PIT RADIO // GRIDSYNC BULLETIN**",
                      "embeds": [{
                          "title": title,
                          "url": WEBSITE,
                          "description": desc or "GridSync update.",
                          "color": 16766720,
                          "fields": fields,
                          "footer": {"text": "Pit Radio · GridSync Community"}
                      }]
                  }

              lines = [
                  f"{e['gs']} GridSync Symbol",
                  f"{e['logo']} GridSync Logo",
                  f"{e['discord']} Discord",
                  f"{e['download']} Download",
                  f"{e['voice']} Voice Packs",
                  f"{e['ratix']} RaTiX",
                  f"{e['tools']} Tools",
                  f"{e['iracedeck']} iRaceDeck",
                  f"{e['irdh']} iRDH",
                  f"{e['car1']} Car 1",
                  f"{e['car2']} Car 2",
                  f"{e['car3']} Car 3"
              ]

              return {
                  "content": "\U0001F4FB **PIT RADIO // EMOJI CHECK**",
                  "embeds": [{
                      "title": "GridSync Pit Radio",
                      "url": WEBSITE,
                      "description": (
                          "Radio loud and clear.\n\n"
                          "**Emoji check**\n"
                          + "\n".join(lines)
                      ),
                      "color": 16766720,
                      "footer": {"text": "Pit Radio · GridSync Community"}
                  }]
              }

          ping = event == "release" or mode == "manual"

          if target in {"gridsync", "both"}:
              send(
                  os.environ["DISCORD_WEBHOOK"],
                  build(True),
                  os.environ["GRIDSYNC_ROLE_ID"],
                  ping
              )

          if target in {"cannabeez", "both"}:
              send(
                  os.environ["CANNABEEZ_WEBHOOK"],
                  build(False),
                  os.environ["CANNABEEZ_ROLE_ID"],
                  ping
              )
          PY
