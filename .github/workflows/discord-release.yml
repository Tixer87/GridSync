name: Pit Radio Community Template

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Pit Radio mode"
        required: true
        default: "test"
        type: choice
        options: [test, manual]
      target:
        description: "Discord target"
        required: true
        default: "main"
        type: choice
        options: [main, changelog, external, both]
      manual_title:
        description: "Release / announcement title"
        required: false
        default: ""
      manual_intro:
        description: "Short intro"
        required: false
        default: ""
      manual_details:
        description: "Details separated with |"
        required: false
        default: ""
      manual_url:
        description: "Details page"
        required: false
        default: ""

jobs:
  broadcast:
    runs-on: ubuntu-latest
    steps:
      - name: Broadcast to Discord
        env:
          # Sensitive values: create these under GitHub Actions Secrets.
          MAIN_WEBHOOK: ${{ secrets.PITRADIO_MAIN_WEBHOOK }}
          CHANGELOG_WEBHOOK: ${{ secrets.PITRADIO_CHANGELOG_WEBHOOK }}
          EXTERNAL_WEBHOOK: ${{ secrets.PITRADIO_EXTERNAL_WEBHOOK }}

          # Optional non-secret configuration: GitHub Actions Variables.
          COMMUNITY_NAME: ${{ vars.PITRADIO_COMMUNITY_NAME }}
          WEBSITE_URL: ${{ vars.PITRADIO_WEBSITE_URL }}
          MAIN_ROLE_ID: ${{ vars.PITRADIO_MAIN_ROLE_ID }}
          EXTERNAL_ROLE_ID: ${{ vars.PITRADIO_EXTERNAL_ROLE_ID }}

          # Optional custom emoji IDs. Missing values use Unicode fallbacks.
          EMOJI_MAIN: ${{ vars.PITRADIO_EMOJI_MAIN }}
          EMOJI_LOGO: ${{ vars.PITRADIO_EMOJI_LOGO }}
          EMOJI_DISCORD: ${{ vars.PITRADIO_EMOJI_DISCORD }}
          EMOJI_DOWNLOAD: ${{ vars.PITRADIO_EMOJI_DOWNLOAD }}
          EMOJI_VOICE: ${{ vars.PITRADIO_EMOJI_VOICE }}
          EMOJI_STATS: ${{ vars.PITRADIO_EMOJI_STATS }}
          EMOJI_TOOLS: ${{ vars.PITRADIO_EMOJI_TOOLS }}
          EMOJI_RACING: ${{ vars.PITRADIO_EMOJI_RACING }}
          EMOJI_CAR1: ${{ vars.PITRADIO_EMOJI_CAR1 }}
          EMOJI_CAR2: ${{ vars.PITRADIO_EMOJI_CAR2 }}
          EMOJI_CAR3: ${{ vars.PITRADIO_EMOJI_CAR3 }}

          MANUAL_MODE: ${{ github.event.inputs.mode }}
          MANUAL_TARGET: ${{ github.event.inputs.target }}
          MANUAL_TITLE: ${{ github.event.inputs.manual_title }}
          MANUAL_INTRO: ${{ github.event.inputs.manual_intro }}
          MANUAL_DETAILS: ${{ github.event.inputs.manual_details }}
          MANUAL_URL: ${{ github.event.inputs.manual_url }}

        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error

          name=os.getenv("COMMUNITY_NAME","").strip() or "Community"
          website=os.getenv("WEBSITE_URL","").strip()
          mode=os.getenv("MANUAL_MODE","test").strip().lower()
          target=os.getenv("MANUAL_TARGET","main").strip().lower()

          if target not in {"main","changelog","external","both"}:
              target="main"

          # Change the first value if your Discord emoji uses another name.
          cfg={
              "main":("community","EMOJI_MAIN","\U0001F3C1"),
              "logo":("community_logo","EMOJI_LOGO","\U0001F3C1"),
              "discord":("discord","EMOJI_DISCORD","\U0001F4AC"),
              "download":("download","EMOJI_DOWNLOAD","\u2B07\uFE0F"),
              "voice":("voice","EMOJI_VOICE","\U0001F399\uFE0F"),
              "stats":("stats","EMOJI_STATS","\U0001F4CA"),
              "tools":("tools","EMOJI_TOOLS","\U0001F6E0\uFE0F"),
              "racing":("racing","EMOJI_RACING","\U0001F3CE\uFE0F"),
              "car1":("car1","EMOJI_CAR1","\U0001F3CE\uFE0F"),
              "car2":("car2","EMOJI_CAR2","\U0001F3CE\uFE0F"),
              "car3":("car3","EMOJI_CAR3","\U0001F3CE\uFE0F")
          }

          def icons(custom):
              return {
                  k:f"<:{emoji_name}:{os.getenv(env)}>"
                  if custom and os.getenv(env) else fallback
                  for k,(emoji_name,env,fallback) in cfg.items()
              }

          def trim(text,limit):
              text=text or ""
              return text if len(text)<=limit else text[:limit-3]+"..."

          def link_field(e,url=""):
              link=url or website
              if not link:return []
              return [{
                  "name":f"{e['download']} Previews · Details · Download",
                  "value":f"[Open details]({link})",
                  "inline":False
              }]

          def send(webhook,payload,role="",ping=False):
              if not webhook:
                  print("Webhook not configured. Skipping target.")
                  return

              msg=json.loads(json.dumps(payload))
              msg["allowed_mentions"]={"roles":[role]} if ping and role else {"parse":[]}

              if ping and role:
                  msg["content"]=f"<@&{role}>\n"+msg.get("content","")

              req=urllib.request.Request(
                  webhook,
                  data=json.dumps(msg).encode(),
                  headers={
                      "Content-Type":"application/json",
                      "User-Agent":"Pit-Radio-Community/1.0"
                  },
                  method="POST"
              )

              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      print(f"Pit Radio broadcast successful: HTTP {r.status}")
              except urllib.error.HTTPError as e:
                  print(e.read().decode(errors="replace"))
                  raise

          def build(custom):
              e=icons(custom)

              if mode=="manual":
                  title=trim(
                      os.getenv("MANUAL_TITLE","").strip()
                      or f"{name} Announcement",
                      256
                  )
                  intro=trim(os.getenv("MANUAL_INTRO","").strip(),500)
                  url=os.getenv("MANUAL_URL","").strip()
                  details=[
                      x.strip()
                      for x in os.getenv("MANUAL_DETAILS","").split("|")
                      if x.strip()
                  ]

                  order=[
                      "main","discord","voice","stats","tools",
                      "download","racing","car1","car2","car3"
                  ]

                  lines=[
                      f"{e[order[i]] if i<len(order) else '•'} {item}"
                      for i,item in enumerate(details)
                  ]

                  desc="\n\n".join(
                      x for x in [
                          f"*{intro}*" if intro else "",
                          "\n".join(lines)
                      ] if x
                  )

                  return {
                      "content":f"{e['main']} **PIT RADIO // COMMUNITY BULLETIN**",
                      "embeds":[{
                          "title":title,
                          "description":desc or "Community update.",
                          "color":16766720,
                          "fields":link_field(e,url),
                          "footer":{"text":f"Pit Radio · {name}"}
                      }]
                  }

              lines=[
                  f"{e['main']} Main",
                  f"{e['logo']} Logo",
                  f"{e['discord']} Discord",
                  f"{e['download']} Download",
                  f"{e['voice']} Voice",
                  f"{e['stats']} Stats",
                  f"{e['tools']} Tools",
                  f"{e['racing']} Racing",
                  f"{e['car1']} Car 1",
                  f"{e['car2']} Car 2",
                  f"{e['car3']} Car 3"
              ]

              return {
                  "content":"\U0001F4FB **PIT RADIO // EMOJI CHECK**",
                  "embeds":[{
                      "title":"Pit Radio",
                      "description":"Radio loud and clear.\n\n**Emoji check**\n"+"\n".join(lines),
                      "color":16766720,
                      "fields":link_field(e),
                      "footer":{"text":f"Pit Radio · {name}"}
                  }]
              }

          ping=mode=="manual"

          if target in {"main","both"}:
              send(
                  os.getenv("MAIN_WEBHOOK",""),
                  build(True),
                  os.getenv("MAIN_ROLE_ID",""),
                  ping
              )

          if target=="changelog":
              send(
                  os.getenv("CHANGELOG_WEBHOOK",""),
                  build(True),
                  os.getenv("MAIN_ROLE_ID",""),
                  ping
              )

          if target in {"external","both"}:
              send(
                  os.getenv("EXTERNAL_WEBHOOK",""),
                  build(False),
                  os.getenv("EXTERNAL_ROLE_ID",""),
                  ping
              )
          PY
