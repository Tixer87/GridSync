name: Pit Radio

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  broadcast:
    runs-on: ubuntu-latest
    steps:
      - name: Broadcast to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          webhook = os.environ["DISCORD_WEBHOOK"].strip()
          event = os.environ.get("EVENT_NAME", "")

          if event == "release":
              name = os.environ.get("RELEASE_NAME") or "New GridSync Release"
              url = os.environ.get("RELEASE_URL", "")
              body = os.environ.get("RELEASE_BODY", "").strip()

              if len(body) > 1800:
                  body = body[:1797] + "..."

              payload = {
                  "content": "🏁 **NEW GRIDSYNC RELEASE — LIVE ON AIR**",
                  "embeds": [
                      {
                          "title": name,
                          "url": url,
                          "description": body or "A new GridSync release is now available.",
                          "color": 16766720,
                          "footer": {
                              "text": "Pit Radio · GridSync Community"
                          }
                      }
                  ]
              }
          else:
              payload = {
                  "content": "📻 **Pit Radio check. Radio loud and clear.**",
                  "embeds": [
                      {
                          "title": "GridSync Pit Radio",
                          "description": "Automatic release broadcasts are connected and ready.",
                          "color": 16766720,
                          "footer": {
                              "text": "Pit Radio · GridSync Community"
                          }
                      }
                  ]
              }

          request = urllib.request.Request(
              webhook,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "Accept": "application/json",
                  "User-Agent": "DiscordBot (https://gridsync.ch, 1.0)"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  print(f"Pit Radio broadcast successful: HTTP {response.status}")
          except urllib.error.HTTPError as error:
              print(f"Discord returned HTTP {error.code}")
              print(error.read().decode("utf-8", errors="replace"))
              raise
          PY
