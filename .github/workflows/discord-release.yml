name: Pit Radio
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      mode:
        description: "test | manual"
        required: true
        default: "test"
      manual_title:
        description: "Release / announcement title"
        required: false
        default: ""
      manual_intro:
        description: "Short intro"
        required: false
        default: ""
      manual_details:
        description: "Details separated with |"
        required: false
        default: ""
      manual_url:
        description: "GridSync page"
        required: false
        default: ""
jobs:
  broadcast:
    runs-on: ubuntu-latest
    steps:
      - name: Broadcast to Discord
        env:

          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          CANNABEEZ_WEBHOOK: ${{ secrets.CANNABEEZ_DISCORD_WEBHOOK }}          
          GRIDSYNC_ROLE_ID: "1553676045692043294"
          CANNABEEZ_ROLE_ID: "1143968549883351101"
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_BODY: ${{ github.event.release.body }}
          MANUAL_MODE: ${{ github.event.inputs.mode }}
          MANUAL_TITLE: ${{ github.event.inputs.manual_title }}
          MANUAL_INTRO: ${{ github.event.inputs.manual_intro }}
          MANUAL_DETAILS: ${{ github.event.inputs.manual_details }}
          MANUAL_URL: ${{ github.event.inputs.manual_url }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error
          gridsync_webhook = os.environ["DISCORD_WEBHOOK"].strip()
          cannabeez_webhook = os.environ["CANNABEEZ_WEBHOOK"].strip()
          gridsync_role_id = os.environ["GRIDSYNC_ROLE_ID"].strip()
          cannabeez_role_id = os.environ["CANNABEEZ_ROLE_ID"].strip()
          event = os.environ.get("EVENT_NAME", "")
          mode = (os.environ.get("MANUAL_MODE") or "").strip().lower()
          def trim(text, limit):
              text = text or ""
              return text if len(text) <= limit else text[:limit - 3] + "..."
          def send(webhook, payload, role_id="", ping_role=False):
              message = json.loads(json.dumps(payload))
          
              if ping_role and role_id:
                  message["content"] = (
                      f"<@&{role_id}>\n"
                      + message.get("content", "")
                  )
          
                  message["allowed_mentions"] = {
                      "roles": [role_id]
                  }
              else:
                  message["allowed_mentions"] = {
                      "parse": []
                  }
          
              request = urllib.request.Request(
                  webhook,
                  data=json.dumps(message).encode("utf-8"),
                  headers={
                      "Content-Type": "application/json",
                      "Accept": "application/json",
                      "User-Agent": "DiscordBot (https://gridsync.ch, 1.0)"
                  },
                  method="POST"
              )
          
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      print(
                          f"Pit Radio broadcast successful: "
                          f"HTTP {response.status}"
                      )
              except urllib.error.HTTPError as error:
                  print(f"Discord returned HTTP {error.code}")
                  print(
                      error.read().decode(
                          "utf-8",
                          errors="replace"
                      )
                  )
                  raise
          if event == "release":
              name = os.environ.get("RELEASE_NAME") or "New GridSync Release"
              url = os.environ.get("RELEASE_URL", "")
              body = trim((os.environ.get("RELEASE_BODY") or "").strip(), 1700)
              payload = {
                  "content": "📻 **PIT RADIO // NEW RELEASE**",
                  "embeds": [
                      {
                          "title": name,
                          "description": body or "A new GridSync release is now available.",
                          "color": 16766720,
                          "fields": [
                              {
                                  "name": "GridSync Release",
                                  "value": f"[Open release]({url})",
                                  "inline": False
                              }
                          ],
                          "footer": {
                              "text": "Pit Radio · GridSync Community"
                          }
                      }
                  ]
              }
          elif mode == "manual":
              title = trim(
                  (os.environ.get("MANUAL_TITLE") or "").strip()
                  or "GridSync Announcement",
                  256
              )
              intro = trim(
                  (os.environ.get("MANUAL_INTRO") or "").strip(),
                  500
              )
              url = (os.environ.get("MANUAL_URL") or "").strip()
              raw_details = (
                  os.environ.get("MANUAL_DETAILS") or ""
              ).strip()
              details = [
                  item.strip()
                  for item in raw_details.split("|")
                  if item.strip()
              ]
              icons = ["🎙️", "🏁", "🎧", "👤", "🏎️", "⚙️"]
              detail_lines = []
              for index, item in enumerate(details):
                  icon = icons[index] if index < len(icons) else "•"
                  detail_lines.append(f"{icon} {item}")
              description_parts = []
              if intro:
                  description_parts.append(f"*{intro}*")
              if detail_lines:
                  description_parts.append("\n".join(detail_lines))
              description = "\n\n".join(description_parts)
              fields = []
              if url:
                  fields.append(
                      {
                          "name": "Previews · Details · Download",
                          "value": f"[Open on GridSync]({url})",
                          "inline": False
                      }
                  )
              payload = {
                  "content": "📻 **PIT RADIO // RELEASE BULLETIN**",
                  "embeds": [
                      {
                          "title": title,
                          "description": description or "GridSync update.",
                          "color": 16766720,
                          "fields": fields,
                          "footer": {
                              "text": "Pit Radio · GridSync Community"
                          }
                      }
                  ]
              }

          else:
               payload = {
                    "content": "📻 **Pit Radio check. Radio loud and clear.**",
                    "embeds": [
                        {
                            "title": "GridSync Pit Radio",
                            "description": "Automatic release broadcasts are connected and ready.",
                            "color": 16766720,
                            "footer": {
                                "text": "Pit Radio · GridSync Community"
                            }
                        }
                    ]
                }

          ping_role = event == "release" or mode == "manual"

          send(
              gridsync_webhook,
              payload,
              gridsync_role_id,
              ping_role
          )
          
          send(
              cannabeez_webhook,
              payload,
              cannabeez_role_id,
              ping_role
          )
          PY
